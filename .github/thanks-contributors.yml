# 贡献者统计配置
title: "🌟 Contributors"
intro: |
  Thanks to all the amazing contributors who have helped make this project better!
  
  This list is automatically generated by GitHub Actions.

badge:
  enabled: true
  style: "flat-square"
  label: "Contributors"
  message: "dynamic"
  color: "blue"

contributors:
  title: "Our Awesome Contributors"
  avatarSize: 40
  limit: 50
  showCommits: true
  showAdditions: true
  showDeletions: true
  sortBy: "commits"  # commits, additions, deletions

sections:
  - title: "📈 Contribution Summary"
    type: "stats"
    stats:
      - "commits"
      - "prs_merged"
      - "issues_closed"
  
  - title: "🏆 Top Contributors"
    type: "list"
    limit: 10
    sort: "commits"
    fields:
      - "avatar"
      - "name"
      - "commits"

output:
  format: "markdown"
  file: "CONTRIBUTORS.md"
  update_readme: true
  readme_section: "<!-- CONTRIBUTORS -->"
  